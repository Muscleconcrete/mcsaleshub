  gold: "#F2A900", goldBright: "#FFC421", goldDark: "#8A6200", goldBg: "#FBF1D9",
  silver: "#C9CDD2", green: "#1E7A4E", greenBg: "#E2F2E9", red: "#B3362B", redBg: "#FBE9E7",
};

const DISPLAY = "'Arial Black', 'Avenir Next Heavy', Impact, sans-serif";
const BODY = "'Avenir Next', 'Segoe UI', system-ui, sans-serif";

const MCMark = ({ size = 44 }) => (
  <img src={LOGO} alt="Muscle Concrete" width={size} height={size}
    style={{ borderRadius: "50%", flexShrink: 0, display: "block" }} />
);

const DollarBadge = ({ size = 34 }) => (
  <div style={{
    width: size, height: size, borderRadius: "50%", flexShrink: 0,
    background: "linear-gradient(160deg, #FFD54A 0%, #F2A900 55%, #C98A00 100%)",
    border: "2px solid #8A6200",
    boxShadow: "0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.5)",
    display: "flex", alignItems: "center", justifyContent: "center",
  }}>
    <span style={{ fontFamily: "'Arial Black', Impact, sans-serif", fontStyle: "italic", fontSize: size * 0.58, color: "#141414", lineHeight: 1, textShadow: "0 1px 0 rgba(255,255,255,0.4)" }}>$</span>
  </div>
);

const JOB_TYPES = ["Building", "Concrete", "Building & Concrete", "Other"];

const fmtMoney = (n) => {
  const v = parseFloat(n);
  return isNaN(v) ? "—" : v.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
};
const fmtCents = (n) => {
  const v = parseFloat(n);
  return isNaN(v) ? "—" : v.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtDate = (iso) => new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null); // {id, name, is_manager}
  const [role, setRole] = useState("rep");
  const [tab, setTab] = useState("home");
  const [subs, setSubs] = useState([]);
  const [anns, setAnns] = useState([]);
  const [reps, setReps] = useState([]);
  const [loading, setLoading] = useState(true);
  const [openGuide, setOpenGuide] = useState(null);
  const [toast, setToast] = useState(null);

  // Auth forms
  const [authMode, setAuthMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [fullName, setFullName] = useState("");
  const [authBusy, setAuthBusy] = useState(false);

  // Sale form
  const [form, setForm] = useState({ customer: "", product: "", notes: "" });
  const [pdfFiles, setPdfFiles] = useState([]); // File objects
  const [submitting, setSubmitting] = useState(false);

  // Announcement form
  const [annForm, setAnnForm] = useState({ title: "", body: "" });

  // Resources (DB-driven, manager-editable)
  const [resources, setResources] = useState([]);
  const [resEditing, setResEditing] = useState(null);
  const [resSaving, setResSaving] = useState(false);
  const [resImgUrls, setResImgUrls] = useState({});

  // Filters
  const [repFilter, setRepFilter] = useState("all");
  const [periodMode, setPeriodMode] = useState("all");
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3200); };

  /* ---------- auth + data loading ---------- */
  useEffect(() => {
    db.auth.getSession().then(({ data }) => { setSession(data.session); setLoading(false); });
    const { data: sub } = db.auth.onAuthStateChange((_e, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  const fetchProfile = useCallback(async () => {
    if (!session) { setProfile(null); return; }
    const { data } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (data) { setProfile(data); return; }
    const name = (session.user.user_metadata && session.user.user_metadata.name) || session.user.email.split("@")[0];
    await db.from("profiles").insert({ id: session.user.id, name });
    const { data: created } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    setProfile(created || null);
  }, [session]);

  const fetchSubs = useCallback(async () => {
    const { data, error } = await db.from("submissions").select("*").order("created_at", { ascending: false });
    if (!error) setSubs(data || []);
  }, []);

  const fetchAnns = useCallback(async () => {
    const { data, error } = await db.from("announcements").select("*").order("created_at", { ascending: false });
    if (!error) setAnns(data || []);
  }, []);

  const fetchReps = useCallback(async () => {
    const { data, error } = await db.from("profiles").select("id, name, is_manager").order("name");
    if (!error) setReps(data || []);
  }, []);

  const fetchResources = useCallback(async () => {
    const { data, error } = await db.from("resources").select("*").order("sort_order").order("created_at");
    if (!error) setResources(data || []);
  }, []);

  useEffect(() => {
    if (!session) return;
    fetchProfile(); fetchSubs(); fetchAnns(); fetchReps(); fetchResources();
    let ch = null;
    if (typeof db.channel === "function") {
      try {
        ch = db
          .channel("hub-live")
          .on("postgres_changes", { event: "*", schema: "public", table: "submissions" }, fetchSubs)
          .on("postgres_changes", { event: "*", schema: "public", table: "announcements" }, fetchAnns)
          .subscribe();
      } catch (e) { console.warn("Live updates unavailable:", e); }
    }
    return () => { if (ch) { try { db.removeChannel(ch); } catch (e) {} } };
  }, [session, fetchProfile, fetchSubs, fetchAnns, fetchReps, fetchResources]);

  // signed URLs for images inside an open resource
  useEffect(() => {
    const imgs = openGuide && openGuide.files ? openGuide.files.filter((f) => (f.type || "").startsWith("image/")) : [];
    if (!imgs.length) return;
    let alive = true;
    (async () => {
      const entries = {};
      for (const f of imgs) {
        try {
          const { data } = await db.storage.from("resources").createSignedUrl(f.path, 3600);
          if (data) entries[f.path] = data.signedUrl;
        } catch (e) {}
      }
      if (alive) setResImgUrls((p) => ({ ...p, ...entries }));
    })();
    return () => { alive = false; };
  }, [openGuide]);

  const signIn = async () => {
    setAuthBusy(true);
    const { error } = await db.auth.signInWithPassword({ email: email.trim(), password });
    setAuthBusy(false);
    if (error) { flash(error.message); return; }
    setEmail(""); setPassword("");
  };

  const signUp = async () => {
    if (fullName.trim().length < 2) { flash("Enter your full name"); return; }
    if (password.length < 6) { flash("Password must be at least 6 characters"); return; }
    setAuthBusy(true);
    const { error } = await db.auth.signUp({
      email: email.trim(), password,
      options: { data: { name: fullName.trim() } },
    });
    setAuthBusy(false);
    if (error) { flash(error.message); return; }
    flash("Account created — if email confirmation is on, check your inbox");
    setFullName("");
  };

  const signOut = async () => { await db.auth.signOut(); setRole("rep"); setTab("home"); };

  /* ---------- sales ---------- */
  const onPickPdf = (e) => {
    const files = Array.from(e.target.files || []);
    const good = [];
    for (const file of files) {
      if (file.type !== "application/pdf") { flash(`${file.name} isn't a PDF — skipped`); continue; }
      if (file.size > MAX_PDF_BYTES) { flash(`${file.name} is too large (max 10MB) — skipped`); continue; }
      good.push(file);
    }
    setPdfFiles((prev) => [...prev, ...good]);
    e.target.value = "";
  };

  const submitSale = async () => {
    if (!form.customer.trim() || !form.product.trim()) {
      flash("Fill in customer and job type."); return;
    }
    if (pdfFiles.length === 0) { flash("Attach at least one signed contract PDF."); return; }
    setSubmitting(true);
    const contracts = [];
    for (const file of pdfFiles) {
      const path = `${session.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
      const { error: upErr } = await db.storage.from("contracts").upload(path, file);
      if (upErr) { setSubmitting(false); flash(`Upload failed for ${file.name}: ` + upErr.message); return; }
      contracts.push({ path, name: file.name });
    }
    const { error } = await db.from("submissions").insert({
      rep_id: session.user.id,
      customer: form.customer.trim(),
      product: form.product,
      notes: form.notes.trim() || null,
      contracts,
      contract_path: contracts[0] ? contracts[0].path : null,
      contract_name: contracts[0] ? contracts[0].name : null,
    });
    setSubmitting(false);
    if (error) { flash("Submit failed: " + error.message); return; }
    flash("Sale submitted for review");
    fetchSubs();
    setForm({ customer: "", product: "", notes: "" });
    setPdfFiles([]);
    setTab("mysales");
  };

  const openContractFile = async (path) => {
    if (!path) return;
    const { data, error } = await db.storage.from("contracts").createSignedUrl(path, 120);
    if (error || !data) { flash("Couldn't load that contract"); return; }
    window.open(data.signedUrl, "_blank");
  };
  const contractsOf = (s) =>
    (s.contracts && s.contracts.length ? s.contracts : (s.contract_path ? [{ path: s.contract_path, name: s.contract_name || "contract.pdf" }] : []));

  const reviewSale = async (sub, status) => {
    const patch = { status, reviewed_at: new Date().toISOString(), review_note: "" };
    if (status === "rejected") {
      patch.review_note = prompt("Note to the rep (corrections needed):") || "";
    } else {
      if (sub.amount == null) {
        const a = prompt("Contract amount for this sale ($):");
        if (a === null) return;
        const av = parseFloat(a);
        if (isNaN(av)) { flash("Enter a dollar amount"); return; }
        patch.amount = av;
      }
      const c = prompt("Commission for this sale ($) — leave blank to post later:");
      if (c !== null && c.trim() !== "" && !isNaN(parseFloat(c))) patch.commission = parseFloat(c);
    }
    const { error } = await db.from("submissions").update(patch).eq("id", sub.id);
    if (error) { flash("Update failed: " + error.message); return; }
    flash(status === "approved" ? "✓ Sale confirmed" : "✗ Sent back with notes");
    fetchSubs();
  };

  const setCommission = async (id) => {
    const c = prompt("Commission for this sale ($):");
    if (c === null) return;
    const v = parseFloat(c);
    if (isNaN(v)) { flash("Enter a dollar amount"); return; }
    const { error } = await db.from("submissions").update({ commission: v }).eq("id", id);
    if (error) { flash("Update failed: " + error.message); return; }
    flash("Commission posted — it now shows on the rep's tracker");
    fetchSubs();
  };

  const markStatus = async (id, newStatus) => {
    if (newStatus === "refunded" && !window.confirm("Remove this sale from totals permanently? (refund or lost dispute)")) return;
    const { error } = await db.from("submissions").update({ status: newStatus, status_changed_at: new Date().toISOString() }).eq("id", id);
    if (error) { flash("Update failed: " + error.message); return; }
    flash(
      newStatus === "disputed" ? "⚠ Marked in dispute — off totals until resolved"
      : newStatus === "approved" ? "✓ Dispute won — sale is back on totals"
      : "Sale removed from totals permanently"
    );
    fetchSubs();
  };

  const deleteSubmission = async (s) => {
    if (!window.confirm(`Permanently DELETE this submission for ${s.customer}? The record and its PDFs are erased for good — it will NOT appear in any history or record. This cannot be undone.`)) return;
    const files = contractsOf(s).map((f) => f.path).filter(Boolean);
    if (files.length) { try { await db.storage.from("contracts").remove(files); } catch (e) {} }
    const { error } = await db.from("submissions").delete().eq("id", s.id);
    if (error) { flash("Delete failed: " + error.message); return; }
    flash("Submission permanently deleted");
    fetchSubs();
  };

  const openResourceFile = async (p) => {
    const { data, error } = await db.storage.from("resources").createSignedUrl(p, 300);
    if (error || !data) { flash("Couldn't load that file"); return; }
    window.open(data.signedUrl, "_blank");
  };

  const startEditRes = (r) => setResEditing(r
    ? { id: r.id, tag: r.tag || "RESOURCE", title: r.title || "", blurb: r.blurb || "", body: r.body || "", links: (r.links || []).map((l) => ({ ...l })), files: (r.files || []).map((f) => ({ ...f })), newFiles: [], removedFiles: [] }
    : { id: null, tag: "RESOURCE", title: "", blurb: "", body: "", links: [], files: [], newFiles: [], removedFiles: [] });

  const onPickResFiles = (e) => {
    const files = Array.from(e.target.files || []);
    const good = [];
    for (const f of files) {
      const ok = f.type === "application/pdf" || f.type.startsWith("image/");
      if (!ok) { flash(`${f.name}: only PDFs and images`); continue; }
      if (f.size > MAX_PDF_BYTES) { flash(`${f.name} too large (max 10MB)`); continue; }
      good.push(f);
    }
    setResEditing((p) => ({ ...p, newFiles: [...p.newFiles, ...good] }));
    e.target.value = "";
  };

  const saveResource = async () => {
    const r = resEditing;
    if (!r.title.trim()) { flash("Resource needs a title"); return; }
    setResSaving(true);
    const files = [...r.files];
    for (const f of r.newFiles) {
      const p = `library/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${f.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
      const { error: upErr } = await db.storage.from("resources").upload(p, f);
      if (upErr) { setResSaving(false); flash(`Upload failed for ${f.name}: ` + upErr.message); return; }
      files.push({ path: p, name: f.name, type: f.type });
    }
    if (r.removedFiles.length) { try { await db.storage.from("resources").remove(r.removedFiles); } catch (e) {} }
    const row = { tag: (r.tag || "RESOURCE").trim(), title: r.title.trim(), blurb: (r.blurb || "").trim(), body: r.body, links: r.links.filter((l) => l.url && l.url.trim()), files };
    const q = r.id ? db.from("resources").update(row).eq("id", r.id) : db.from("resources").insert(row);
    const { error } = await q;
    setResSaving(false);
    if (error) { flash("Save failed: " + error.message); return; }
    flash(r.id ? "Resource updated — live for the whole team" : "Resource added — live for the whole team");
    setResEditing(null);
    fetchResources();
  };

  const deleteResource = async (r) => {
    if (!window.confirm(`Delete "${r.title}" for the whole team? This cannot be undone.`)) return;
    const paths = (r.files || []).map((f) => f.path);
    if (paths.length) { try { await db.storage.from("resources").remove(paths); } catch (e) {} }
    const { error } = await db.from("resources").delete().eq("id", r.id);
    if (error) { flash("Delete failed: " + error.message); return; }
    flash("Resource deleted");
    fetchResources();
  };

  /* ---------- announcements ---------- */
  const postAnnouncement = async () => {
    if (!annForm.title.trim() || !annForm.body.trim()) { flash("Announcement needs a title and message."); return; }
    const { error } = await db.from("announcements").insert({
      author: profile ? profile.name : null,
      title: annForm.title.trim(),
      body: annForm.body.trim(),
    });
    if (error) { flash("Post failed: " + error.message); return; }
    flash("Announcement posted");
    fetchAnns();
    setAnnForm({ title: "", body: "" });
  };

  const deleteAnnouncement = async (id) => {
    const { error } = await db.from("announcements").delete().eq("id", id);
    if (error) { flash("Delete failed: " + error.message); return; }
    fetchAnns();
  };

  /* ---------- derived ---------- */
  const isManager = !!(profile && profile.is_manager);

  const inPeriod = (iso) => {
    if (periodMode === "all") return true;
    const d = new Date(iso);
    const now = new Date();
    if (periodMode === "week") {
      const start = new Date(now); start.setHours(0, 0, 0, 0); start.setDate(now.getDate() - now.getDay());
      return d >= start;
    }
    if (periodMode === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (periodMode === "year") return d.getFullYear() === now.getFullYear();
    if (periodMode === "custom") {
      if (customStart && d < new Date(customStart + "T00:00:00")) return false;
      if (customEnd && d > new Date(customEnd + "T23:59:59")) return false;
      return true;
    }
    return true;
  };

  const repName = (id) => (reps.find((r) => r.id === id) || {}).name || "Unknown";
  const sum = (arr, key) => arr.reduce((t, s) => t + (parseFloat(s[key]) || 0), 0);

  const pendingAll = subs.filter((s) => s.status === "pending");
  const mySubs = session ? subs.filter((s) => s.rep_id === session.user.id && inPeriod(s.created_at)) : [];
  const myApproved = mySubs.filter((s) => s.status === "approved");
  const myApprovedTotal = sum(myApproved, "amount");
  const myCommissionTotal = sum(myApproved, "commission");
  const myPending = mySubs.filter((s) => s.status === "pending");
  const myDisputed = mySubs.filter((s) => s.status === "disputed");

  const visibleSubs = (repFilter === "all" ? subs : subs.filter((s) => s.rep_id === repFilter)).filter((s) => inPeriod(s.created_at));
  const visiblePending = visibleSubs.filter((s) => s.status === "pending");
  const visibleReviewed = visibleSubs.filter((s) => s.status !== "pending");
  const visApproved = visibleSubs.filter((s) => s.status === "approved");
  const visApprovedTotal = sum(visApproved, "amount");
  const visCommissionTotal = sum(visApproved, "commission");
  const visDisputed = visibleSubs.filter((s) => s.status === "disputed");
  const recordSubs = (repFilter === "all" ? subs : subs.filter((s) => s.rep_id === repFilter))
    .filter((s) => s.status === "disputed" || s.status === "refunded");

  const tabs = role === "manager"
    ? [["home", "Home"], ["guides", "Resources"], ["review", `Review${pendingAll.length ? ` (${pendingAll.length})` : ""}`], ["announce", "Post announcement"]]
    : [["home", "Home"], ["guides", "Resources"], ["submit", "Submit a sale"], ["mysales", "My submissions"]];

  /* ---------- shared styles ---------- */
  const statusPill = (st) => {
    const map = {
      pending: { bg: C.goldBg, fg: C.goldDark, label: "Pending review" },
      approved: { bg: C.greenBg, fg: C.green, label: "✓ Approved" },
      rejected: { bg: C.redBg, fg: C.red, label: "✗ Sent back" },
      disputed: { bg: "#FDEBD2", fg: "#A05A00", label: "⚠ In dispute" },
      refunded: { bg: "#ECECEA", fg: C.sub, label: "↩ Refunded / removed" },
    }[st];
    return (
      <span style={{ background: map.bg, color: map.fg, fontSize: 12, fontWeight: 700, padding: "3px 10px", borderRadius: 999, letterSpacing: 0.3 }}>
        {map.label}
      </span>
    );
  };

  const input = (props) => ({
    style: {
      width: "100%", boxSizing: "border-box", padding: "11px 12px", borderRadius: 6,
      border: `1.5px solid ${C.line}`, fontSize: 15, color: C.ink, background: "#fff",
      outline: "none", fontFamily: BODY,
    },
    ...props,
  });
  const label = { display: "block", fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: "uppercase", color: C.sub, marginBottom: 6 };
  const card = { background: C.card, border: `1px solid ${C.line}`, borderRadius: 10, padding: 20, boxShadow: "0 1px 3px rgba(0,0,0,0.05)" };
  const heading = { fontFamily: DISPLAY, fontStyle: "italic", letterSpacing: 0.2, textTransform: "uppercase" };
  const btnGold = {
    padding: "12px 22px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 14, fontWeight: 800,
    background: `linear-gradient(180deg, ${C.goldBright}, ${C.gold})`, color: C.black, fontFamily: BODY,
    textTransform: "uppercase", letterSpacing: 0.8,
  };
  const btnGray = { ...btnGold, background: "#E7E7E3", color: C.ink };
  const linkBtn = {
    border: `1.5px solid ${C.gold}`, background: "#fff", color: C.goldDark, cursor: "pointer",
    padding: "7px 14px", borderRadius: 6, fontSize: 13, fontWeight: 800, fontFamily: BODY,
  };
  const smallBtn = (color) => ({
    border: `1.5px solid ${color}`, background: "#fff", color, cursor: "pointer",
    padding: "3px 10px", borderRadius: 6, fontSize: 12, fontWeight: 800, fontFamily: BODY,
  });

  const contractChip = (s) => {
    const files = contractsOf(s);
    return files.length ? (
      <span style={{ display: "inline-flex", gap: 6, flexWrap: "wrap" }}>
        {files.map((f, i) => (
          <button key={i} style={linkBtn} onClick={() => openContractFile(f.path)}>
            📄 {f.name.length > 24 ? f.name.slice(0, 21) + "…" : f.name}
          </button>
        ))}
      </span>
    ) : (
      <span style={{ fontSize: 13, color: C.red, fontWeight: 700 }}>No contract attached</span>
    );
  };

  const periodBar = (
    <div style={{ ...card, padding: "12px 16px", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
      <span style={{ fontSize: 12, fontWeight: 800, letterSpacing: 0.8, textTransform: "uppercase", color: C.sub, marginRight: 4 }}>Period</span>
      {[["all", "All time"], ["week", "This week"], ["month", "This month"], ["year", "This year"], ["custom", "Custom"]].map(([m, lbl]) => (
        <button key={m} onClick={() => setPeriodMode(m)}
          style={{
            padding: "6px 13px", borderRadius: 999, cursor: "pointer", fontSize: 13, fontWeight: 800, fontFamily: BODY,
            border: `1.5px solid ${periodMode === m ? C.gold : C.line}`,
            background: periodMode === m ? C.goldBg : "#fff",
            color: periodMode === m ? C.goldDark : C.sub,
          }}>
          {lbl}
        </button>
      ))}
      {periodMode === "custom" && (
        <span style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          <input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)}
            style={{ padding: "6px 8px", borderRadius: 6, border: `1.5px solid ${C.line}`, fontSize: 13, fontFamily: BODY }} />
          <span style={{ color: C.sub, fontSize: 13 }}>to</span>
          <input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)}
            style={{ padding: "6px 8px", borderRadius: 6, border: `1.5px solid ${C.line}`, fontSize: 13, fontFamily: BODY }} />
        </span>
      )}
    </div>
  );

  /* ---------- auth screen ---------- */
  if (!loading && !session) {
    return (
      <div style={{ minHeight: "100vh", background: C.bg, fontFamily: BODY, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        <div style={{ ...card, maxWidth: 420, width: "100%", borderTop: `4px solid ${C.gold}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
            <MCMark size={48} />
            <div>
              <div style={{ ...heading, fontSize: 18 }}>
                <span style={{ color: "#6B6E72" }}>Muscle</span> <span style={{ color: C.goldDark }}>Concrete</span>
              </div>
              <div style={{ ...heading, fontSize: 13, color: C.goldDark }}>Sales Hub</div>
            </div>
          </div>
          <div style={{ display: "flex", background: "#EDEDEA", borderRadius: 8, padding: 3, margin: "16px 0" }}>
            {[["signin", "Sign in"], ["signup", "Create account"]].map(([m, lbl]) => (
              <button key={m} onClick={() => setAuthMode(m)}
                style={{
                  flex: 1, padding: "9px 0", borderRadius: 6, border: "none", cursor: "pointer",
                  fontSize: 13.5, fontWeight: 800, fontFamily: BODY,
                  background: authMode === m ? "#fff" : "transparent",
                  color: authMode === m ? C.ink : C.sub,
                  boxShadow: authMode === m ? "0 1px 3px rgba(0,0,0,0.12)" : "none",
                }}>
                {lbl}
              </button>
            ))}
          </div>
          <div style={{ display: "grid", gap: 14 }}>
            {authMode === "signup" && (
              <div><span style={label}>Full name</span><input {...input({ value: fullName, onChange: (e) => setFullName(e.target.value), placeholder: "e.g. Jordan Reyes" })} /></div>
            )}
            <div><span style={label}>Email</span><input {...input({ type: "email", value: email, onChange: (e) => setEmail(e.target.value) })} /></div>
            <div><span style={label}>Password</span><input {...input({ type: "password", value: password, onChange: (e) => setPassword(e.target.value) })} /></div>
            <button style={{ ...btnGold, opacity: authBusy ? 0.6 : 1 }} disabled={authBusy}
              onClick={authMode === "signin" ? signIn : signUp}>
              {authBusy ? "Working…" : authMode === "signin" ? "Sign In" : "Create Account"}
            </button>
          </div>
        </div>
        {toast && (
          <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: C.black, color: C.goldBright, border: `1.5px solid ${C.gold}`, padding: "12px 22px", borderRadius: 999, fontSize: 14, fontWeight: 800, maxWidth: "90vw", textAlign: "center" }}>
            {toast}
          </div>
        )}
      </div>
    );
  }

  /* ---------- main app ---------- */
  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.ink, fontFamily: BODY }}>
      <header style={{ background: `linear-gradient(180deg, #232426 0%, ${C.black} 100%)`, color: "#fff", borderBottom: `4px solid ${C.gold}`, padding: "0 20px" }}>
        <div style={{ maxWidth: 960, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12, padding: "16px 0 14px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <MCMark size={52} />
            <div>
              <div style={{ ...heading, fontSize: 20, lineHeight: 1.05 }}>
                <span style={{ color: C.silver }}>Muscle</span>{" "}
                <span style={{ color: C.goldBright }}>Concrete</span>
              </div>
              <div style={{ fontFamily: DISPLAY, fontStyle: "italic", fontSize: 15, color: C.goldBright, letterSpacing: 1.5, textTransform: "uppercase", marginTop: 3, textShadow: "1px 1px 0 #000" }}>
                Sales Hub
              </div>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            {profile && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                <span style={{ color: C.silver }}>
                  {isManager ? "Manager: " : "Rep: "}
                  <strong style={{ color: "#fff" }}>{profile.name}</strong>
                </span>
                <button onClick={signOut} style={{ border: "1px solid #3A3B3E", background: "transparent", color: "#A9ABAF", borderRadius: 6, padding: "5px 10px", cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: BODY }}>
                  Sign out
                </button>
              </div>
            )}
            {isManager && (
              <div style={{ display: "flex", background: "#2C2D30", borderRadius: 999, padding: 3, border: "1px solid #3A3B3E" }}>
                {[["rep", "Rep view"], ["manager", "Manager view"]].map(([r, lbl]) => (
                  <button key={r} onClick={() => { setRole(r); setTab("home"); }}
                    style={{
                      padding: "7px 16px", borderRadius: 999, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 800,
                      background: role === r ? C.gold : "transparent", color: role === r ? C.black : "#A9ABAF", fontFamily: BODY,
                    }}>
                    {lbl}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
        <nav style={{ maxWidth: 960, margin: "0 auto", display: "flex", gap: 4, overflowX: "auto" }}>
          {tabs.map(([id, lbl]) => (
            <button key={id} onClick={() => setTab(id)}
              style={{
                padding: "10px 16px", border: "none", cursor: "pointer", fontSize: 13.5, fontWeight: 800, whiteSpace: "nowrap",
                textTransform: "uppercase", letterSpacing: 0.6,
                background: tab === id ? C.bg : "transparent", color: tab === id ? C.ink : "#A9ABAF",
                borderRadius: "8px 8px 0 0", fontFamily: BODY,
              }}>
              {id === "submit" && <span style={{ color: tab === id ? C.goldDark : C.goldBright, marginRight: 4 }}>$</span>}
              {lbl}
            </button>
          ))}
        </nav>
      </header>

      <main style={{ maxWidth: 960, margin: "0 auto", padding: "24px 20px 60px" }}>
        {loading ? (
          <div style={{ ...card, textAlign: "center", color: C.sub }}>Loading the hub…</div>
        ) : (
          <>
            {/* HOME */}
            {tab === "home" && (
              <div style={{ display: "grid", gap: 16 }}>
                <div style={card}>
                  <div style={{ ...heading, fontSize: 14, color: C.goldDark, marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ color: C.gold }}>★</span> Announcements & Changes
                  </div>
                  {anns.length === 0 ? (
                    <div style={{ color: C.sub, fontSize: 15 }}>
                      Nothing posted yet. {role === "manager" ? "Post the first announcement from the tab above." : "Check back here for new changes from management."}
                    </div>
                  ) : (
                    anns.map((a) => (
                      <div key={a.id} style={{ borderTop: `1px solid ${C.line}`, padding: "14px 0", display: "flex", justifyContent: "space-between", gap: 12 }}>
                        <div>
                          <div style={{ fontWeight: 800, fontSize: 16 }}>{a.title}</div>
                          <div style={{ fontSize: 13, color: C.sub, margin: "2px 0 6px" }}>
                            {a.author ? `${a.author} · ` : ""}{fmtDate(a.created_at)}
                          </div>
                          <div style={{ fontSize: 15, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{a.body}</div>
                        </div>
                        {role === "manager" && (
                          <button onClick={() => deleteAnnouncement(a.id)} title="Delete announcement"
                            style={{ border: "none", background: "transparent", color: C.sub, cursor: "pointer", fontSize: 18, height: 28 }}>✕</button>
                        )}
                      </div>
                    ))
                  )}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 16 }}>
                  <div style={{ ...card, cursor: "pointer", borderTop: `4px solid ${C.gold}` }} onClick={() => setTab("guides")}>
                    <div style={{ ...heading, fontSize: 15, margin: "2px 0 6px" }}>Study Guide & Resources</div>
                    <div style={{ fontSize: 14, color: C.sub }}>Training material, pricing rules, and policies — one click away.</div>
                  </div>
                  <div style={{ ...card, cursor: "pointer", borderTop: `4px solid ${C.charcoal}` }} onClick={() => setTab(role === "manager" ? "review" : "submit")}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "2px 0 6px" }}>
                      {role !== "manager" && <DollarBadge size={30} />}
                      <div style={{ ...heading, fontSize: 15 }}>
                        {role === "manager" ? `Review Queue${pendingAll.length ? ` — ${pendingAll.length} waiting` : ""}` : "Submit a Sale"}
                      </div>
                    </div>
                    <div style={{ fontSize: 14, color: C.sub }}>
                      {role === "manager" ? "Approve or send back rep submissions." : "Log your signed contract for management review."}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* GUIDES */}
            {tab === "guides" && (
              <div style={{ display: "grid", gap: 16 }}>
                {role === "manager" && (
                  <div style={{ display: "flex", justifyContent: "flex-end" }}>
                    <button style={btnGold} onClick={() => startEditRes(null)}>+ New Resource</button>
                  </div>
                )}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16 }}>
                  {resources.length === 0 && (
                    <div style={{ ...card, color: C.sub }}>
                      No resources yet.{role === "manager" ? " Tap + New Resource to add the first study guide." : " Check back soon."}
                    </div>
                  )}
                  {resources.map((g) => (
                    <div key={g.id} style={{ ...card, borderLeft: `4px solid ${C.gold}`, display: "flex", flexDirection: "column" }}>
                      <div onClick={() => setOpenGuide(g)} style={{ cursor: "pointer", flex: 1 }}>
                        <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.4, color: C.goldDark }}>★ {g.tag}</div>
                        <div style={{ ...heading, fontSize: 17, margin: "8px 0 6px" }}>{g.title}</div>
                        <div style={{ fontSize: 14, color: C.sub, lineHeight: 1.5 }}>{g.blurb}</div>
                        <div style={{ marginTop: 12, fontSize: 13, fontWeight: 800, color: C.goldDark, textTransform: "uppercase", letterSpacing: 0.6 }}>Open →</div>
                      </div>
                      {role === "manager" && (
                        <div style={{ display: "flex", gap: 8, marginTop: 12, borderTop: `1px solid ${C.line}`, paddingTop: 10 }}>
                          <button style={smallBtn(C.goldDark)} onClick={() => startEditRes(g)}>✎ Edit</button>
                          <button style={smallBtn(C.sub)} onClick={() => deleteResource(g)}>🗑 Delete</button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SUBMIT */}
            {tab === "submit" && role === "rep" && (
              <div style={{ ...card, maxWidth: 560, borderTop: `4px solid ${C.gold}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
                  <DollarBadge size={40} />
                  <div style={{ ...heading, fontSize: 20 }}>Submit a Sale for Review</div>
                </div>
                <div style={{ fontSize: 14, color: C.sub, marginBottom: 18 }}>
                  Submitting as <strong style={{ color: C.ink }}>{profile ? profile.name : ""}</strong>. Management reviews the contract, pricing, and scope.
                </div>
                <div style={{ display: "grid", gap: 14 }}>
                  <div><span style={label}>Customer name</span><input {...input({ value: form.customer, onChange: (e) => setForm({ ...form, customer: e.target.value }) })} /></div>
                  <div>
                    <span style={label}>Job type</span>
                    <select {...input({ value: form.product, onChange: (e) => setForm({ ...form, product: e.target.value }) })}>
                      <option value="">Select a job type…</option>
                      {JOB_TYPES.map((j) => <option key={j} value={j}>{j}</option>)}
                    </select>
                  </div>
                  <div>
                    <span style={label}>Signed contracts (PDF, max 10MB each)</span>
                    <div style={{ border: `2px dashed ${pdfFiles.length ? C.green : C.line}`, borderRadius: 8, padding: 16, background: pdfFiles.length ? C.greenBg : "#FAFAF8" }}>
                      {pdfFiles.map((f, i) => (
                        <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap", padding: "4px 0" }}>
                          <span style={{ fontSize: 14, fontWeight: 700, color: C.green }}>
                            📄 {f.name} ({(f.size / 1024).toFixed(0)} KB)
                          </span>
                          <button onClick={() => setPdfFiles(pdfFiles.filter((_, j) => j !== i))}
                            style={{ border: "none", background: "transparent", color: C.red, cursor: "pointer", fontSize: 13, fontWeight: 800, fontFamily: BODY }}>
                            Remove
                          </button>
                        </div>
                      ))}
                      <label style={{ cursor: "pointer", display: "block", textAlign: "center", paddingTop: pdfFiles.length ? 8 : 0 }}>
                        <span style={{ fontSize: 14, color: C.sub }}>
                          <strong style={{ color: C.goldDark }}>{pdfFiles.length ? "+ Add another PDF" : "Choose PDF(s)"}</strong> of the signed contract
                        </span>
                        <input type="file" accept="application/pdf" multiple onChange={onPickPdf} style={{ display: "none" }} />
                      </label>
                    </div>
                  </div>
                  <div><span style={label}>Notes for management</span>
                    <textarea {...input({ value: form.notes, onChange: (e) => setForm({ ...form, notes: e.target.value }), rows: 3, placeholder: "Job details — anything the reviewer should know" })} />
                  </div>
                  <button style={{ ...btnGold, opacity: submitting ? 0.6 : 1 }} onClick={submitSale} disabled={submitting}>
                    {submitting ? "Submitting…" : "Submit for Review"}
                  </button>
                </div>
              </div>
            )}

            {/* MY SALES */}
            {tab === "mysales" && role === "rep" && (
              <div style={{ display: "grid", gap: 12 }}>
                {periodBar}
                {myDisputed.length > 0 && (
                  <div style={{ ...card, borderLeft: "4px solid #A05A00", background: "#FDF6EA", padding: "12px 16px", fontSize: 14 }}>
                    <strong>⚠ {myDisputed.length} sale{myDisputed.length === 1 ? "" : "s"} in dispute</strong> — {fmtMoney(sum(myDisputed, "amount"))} is temporarily off your totals until management resolves {myDisputed.length === 1 ? "it" : "them"}.
                  </div>
                )}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 12 }}>
                  <div style={{ ...card, borderTop: `4px solid ${C.green}`, textAlign: "center" }}>
                    <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, textTransform: "uppercase", color: C.sub }}>Total Sales (Approved)</div>
                    <div style={{ ...heading, fontSize: 24, color: C.green, marginTop: 4 }}>{fmtMoney(myApprovedTotal)}</div>
                    <div style={{ fontSize: 12.5, color: C.sub, marginTop: 2 }}>{myApproved.length} confirmed sale{myApproved.length === 1 ? "" : "s"}</div>
                  </div>
                  <div style={{ ...card, borderTop: `4px solid ${C.gold}`, textAlign: "center" }}>
                    <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, textTransform: "uppercase", color: C.sub }}>Commission Earned</div>
                    <div style={{ ...heading, fontSize: 24, color: C.goldDark, marginTop: 4 }}>{fmtCents(myCommissionTotal)}</div>
                    <div style={{ fontSize: 12.5, color: C.sub, marginTop: 2 }}>posted by management</div>
                  </div>
                  <div style={{ ...card, borderTop: `4px solid ${C.charcoal}`, textAlign: "center" }}>
                    <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, textTransform: "uppercase", color: C.sub }}>Pending Review</div>
                    <div style={{ ...heading, fontSize: 24, marginTop: 4 }}>{myPending.length}</div>
                    <div style={{ fontSize: 12.5, color: C.sub, marginTop: 2 }}>{fmtMoney(sum(myPending, "amount"))} waiting</div>
                  </div>
                </div>
                {mySubs.length === 0 ? (
                  <div style={{ ...card, color: C.sub }}>No submissions in this period. Sign a contract, then log it under “Submit a sale.”</div>
                ) : mySubs.map((s) => (
                  <div key={s.id} style={card}>
                    <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                      <div style={{ fontWeight: 800, fontSize: 16 }}>{s.product} — {fmtMoney(s.amount)}</div>
                      {statusPill(s.status)}
                    </div>
                    <div style={{ fontSize: 14, color: C.sub, margin: "4px 0 8px" }}>
                      Customer: {s.customer} · {fmtDate(s.created_at)}{s.discount ? ` · ${s.discount}% discount` : ""}
                    </div>
                    {contractChip(s)}
                    {s.status === "approved" && s.commission != null && (
                      <div style={{ marginTop: 8, display: "inline-block", background: C.greenBg, color: C.green, padding: "5px 12px", borderRadius: 6, fontSize: 14, fontWeight: 800, marginLeft: 8 }}>
                        Commission: {fmtCents(s.commission)}
                      </div>
                    )}
                    {s.notes && <div style={{ fontSize: 14, marginTop: 8 }}>{s.notes}</div>}
                    {s.status === "rejected" && s.review_note && (
                      <div style={{ marginTop: 10, background: C.redBg, color: C.red, padding: "10px 12px", borderRadius: 6, fontSize: 14 }}>
                        <strong>Manager note:</strong> {s.review_note}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* REVIEW (manager) */}
            {tab === "review" && role === "manager" && isManager && (
              <div style={{ display: "grid", gap: 12 }}>
                {periodBar}
                <div style={{ ...card, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 14, flexWrap: "wrap", padding: "14px 20px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 12, fontWeight: 800, letterSpacing: 0.8, textTransform: "uppercase", color: C.sub }}>Filter by rep</span>
                    <select value={repFilter} onChange={(e) => setRepFilter(e.target.value)}
                      style={{ padding: "8px 12px", borderRadius: 6, border: `1.5px solid ${C.line}`, fontSize: 14, fontFamily: BODY, background: "#fff", color: C.ink }}>
                      <option value="all">All reps</option>
                      {reps.filter((r) => !r.is_manager).map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                    </select>
                  </div>
                  <div style={{ display: "flex", gap: 18, fontSize: 14, flexWrap: "wrap" }}>
                    <span><strong style={{ color: C.green }}>{fmtMoney(visApprovedTotal)}</strong> <span style={{ color: C.sub }}>approved</span></span>
                    <span><strong style={{ color: C.goldDark }}>{fmtCents(visCommissionTotal)}</strong> <span style={{ color: C.sub }}>commission</span></span>
                    <span><strong>{visiblePending.length}</strong> <span style={{ color: C.sub }}>pending</span></span>
                    {visDisputed.length > 0 && (
                      <span><strong style={{ color: "#A05A00" }}>{fmtMoney(sum(visDisputed, "amount"))}</strong> <span style={{ color: C.sub }}>in dispute</span></span>
                    )}
                  </div>
                </div>

                {visiblePending.length === 0 && (
                  <div style={{ ...card, color: C.sub }}>
                    {repFilter === "all" ? "Queue is clear — no sales waiting for review." : "No pending sales from this rep."}
                  </div>
                )}
                {visiblePending.map((s) => (
                  <div key={s.id} style={{ ...card, borderLeft: `4px solid ${C.gold}` }}>
                    <div style={{ fontWeight: 800, fontSize: 16 }}>{s.product} — {fmtMoney(s.amount)}</div>
                    <div style={{ fontSize: 14, color: C.sub, margin: "4px 0 8px" }}>
                      Rep: {repName(s.rep_id)} · Customer: {s.customer} · {fmtDate(s.created_at)}{s.discount ? ` · ${s.discount}% discount` : ""}
                    </div>
                    {contractChip(s)}
                    {s.notes && <div style={{ fontSize: 14, marginTop: 8 }}>“{s.notes}”</div>}
                    <div style={{ display: "flex", gap: 10, marginTop: 14, flexWrap: "wrap" }}>
                      <button style={{ ...btnGold, background: C.green, color: "#fff" }} onClick={() => reviewSale(s, "approved")}>✓ Confirm</button>
                      <button style={{ ...btnGray, color: C.red }} onClick={() => reviewSale(s, "rejected")}>✗ Send Back with Notes</button>
                      <button style={{ ...btnGray, color: C.sub }} onClick={() => deleteSubmission(s)} title="Permanently delete this submission">🗑 Delete</button>
                    </div>
                  </div>
                ))}

                {visibleReviewed.length > 0 && (
                  <div style={{ ...card }}>
                    <div style={{ ...heading, fontSize: 14, marginBottom: 10 }}>Reviewed</div>
                    {visibleReviewed.map((s) => (
                      <div key={s.id} style={{ borderTop: `1px solid ${C.line}`, padding: "12px 0", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                        <div style={{ fontSize: 14 }}>
                          <strong>{repName(s.rep_id)}</strong> · {s.customer} · {s.product} · {fmtMoney(s.amount)}
                          {s.status === "approved" && (
                            s.commission != null ? (
                              <span style={{ marginLeft: 10, color: C.goldDark, fontWeight: 800 }}>
                                Comm: {fmtCents(s.commission)}
                                <button style={{ border: "none", background: "transparent", color: C.sub, cursor: "pointer", fontSize: 12, fontWeight: 700, marginLeft: 4, fontFamily: BODY, textDecoration: "underline" }}
                                  onClick={() => setCommission(s.id)}>edit</button>
                              </span>
                            ) : (
                              <button style={{ ...linkBtn, padding: "3px 10px", marginLeft: 10, fontSize: 12 }} onClick={() => setCommission(s.id)}>
                                + Post commission
                              </button>
                            )
                          )}
                          {contractsOf(s).map((f, i) => (
                            <button key={i} style={{ ...linkBtn, padding: "3px 10px", marginLeft: 10, fontSize: 12 }} onClick={() => openContractFile(f.path)}>
                              📄 {contractsOf(s).length > 1 ? `PDF ${i + 1}` : "Contract"}
                            </button>
                          ))}
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                          {s.status === "approved" && (
                            <>
                              <button style={smallBtn("#A05A00")} onClick={() => markStatus(s.id, "disputed")}>⚠ Dispute</button>
                              <button style={smallBtn(C.sub)} onClick={() => markStatus(s.id, "refunded")}>↩ Refund</button>
                            </>
                          )}
                          {s.status === "disputed" && (
                            <>
                              <button style={smallBtn(C.green)} onClick={() => markStatus(s.id, "approved")}>✓ Dispute won</button>
                              <button style={smallBtn(C.red)} onClick={() => markStatus(s.id, "refunded")}>✗ Dispute lost</button>
                            </>
                          )}
                          <button style={smallBtn(C.sub)} onClick={() => deleteSubmission(s)} title="Permanently delete this submission">🗑</button>
                          {statusPill(s.status)}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {recordSubs.length > 0 && (
                  <div style={{ ...card, borderTop: "4px solid #A05A00" }}>
                    <div style={{ ...heading, fontSize: 14, marginBottom: 4 }}>Disputes & Refunds Record</div>
                    <div style={{ fontSize: 13, color: C.sub, marginBottom: 10 }}>
                      Permanent record, all dates{repFilter !== "all" ? " for this rep" : ""} — these sales are off the totals but never deleted.
                    </div>
                    {recordSubs.map((s) => (
                      <div key={s.id} style={{ borderTop: `1px solid ${C.line}`, padding: "12px 0", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                        <div style={{ fontSize: 14, lineHeight: 1.6 }}>
                          <strong>{s.customer}</strong> · {s.product} · {fmtMoney(s.amount)}
                          <div style={{ fontSize: 13, color: C.sub }}>
                            Rep: {repName(s.rep_id)} · Sold {fmtDate(s.created_at)}{s.status_changed_at ? ` · Marked ${fmtDate(s.status_changed_at)}` : ""}
                            {contractsOf(s).map((f, i) => (
                              <button key={i} style={{ ...linkBtn, padding: "2px 9px", marginLeft: 8, fontSize: 12 }} onClick={() => openContractFile(f.path)}>
                                📄 {contractsOf(s).length > 1 ? `PDF ${i + 1}` : "Contract"}
                              </button>
                            ))}
                          </div>
                        </div>
                        {statusPill(s.status)}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ANNOUNCE (manager) */}
            {tab === "announce" && role === "manager" && isManager && (
              <div style={{ ...card, maxWidth: 560 }}>
                <div style={{ ...heading, fontSize: 20, marginBottom: 4 }}>Post an Announcement</div>
                <div style={{ fontSize: 14, color: C.sub, marginBottom: 18 }}>
                  Posts as <strong style={{ color: C.ink }}>{profile ? profile.name : ""}</strong> and shows on the Home tab for the whole team — live.
                </div>
                <div style={{ display: "grid", gap: 14 }}>
                  <div><span style={label}>Title</span><input {...input({ value: annForm.title, onChange: (e) => setAnnForm({ ...annForm, title: e.target.value }), placeholder: "e.g. New stamped concrete pricing starts Monday" })} /></div>
                  <div><span style={label}>Message</span>
                    <textarea {...input({ value: annForm.body, onChange: (e) => setAnnForm({ ...annForm, body: e.target.value }), rows: 5 })} />
                  </div>
                  <button style={btnGold} onClick={postAnnouncement}>Post Announcement</button>
                </div>
              </div>
            )}
          </>
        )}
      </main>

      {/* GUIDE MODAL */}
      {openGuide && (
        <div onClick={() => setOpenGuide(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(10,10,10,0.65)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }}>
          <div onClick={(e) => e.stopPropagation()}
            style={{ background: "#fff", borderRadius: 12, maxWidth: 640, width: "100%", maxHeight: "85vh", overflowY: "auto", borderTop: `5px solid ${C.gold}` }}>
            <div style={{ padding: 28 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start", gap: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <MCMark size={40} />
                  <div>
                    <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.4, color: C.goldDark }}>★ {openGuide.tag}</div>
                    <h2 style={{ ...heading, margin: "2px 0 0", fontSize: 22 }}>{openGuide.title}</h2>
                  </div>
                </div>
                <button onClick={() => setOpenGuide(null)}
                  style={{ border: "none", background: "#EDEDEA", borderRadius: 6, width: 34, height: 34, cursor: "pointer", fontSize: 16, color: C.ink }}>✕</button>
              </div>
              {(openGuide.body || "").split(/\n\s*\n/).filter(Boolean).map((para, i) => (
                para.trim().startsWith("# ") ? (
                  <div key={i} style={{ ...heading, fontSize: 15, marginTop: 22, marginBottom: 6, paddingBottom: 6, borderBottom: `2px solid ${C.gold}` }}>{para.trim().slice(2)}</div>
                ) : (
                  <div key={i} style={{ fontSize: 15, lineHeight: 1.65, color: "#333639", marginTop: 12, whiteSpace: "pre-wrap" }}>{para}</div>
                )
              ))}
              {(openGuide.links || []).length > 0 && (
                <div style={{ marginTop: 22 }}>
                  <div style={{ ...heading, fontSize: 15, marginBottom: 8, paddingBottom: 6, borderBottom: `2px solid ${C.gold}` }}>Links</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {(openGuide.links || []).map((l, i) => (
                      <a key={i} href={l.url} target="_blank" rel="noreferrer" style={{ color: C.goldDark, fontWeight: 800, fontSize: 14, textDecoration: "none" }}>
                        🔗 {l.label || l.url}
                      </a>
                    ))}
                  </div>
                </div>
              )}
              {(openGuide.files || []).length > 0 && (
                <div style={{ marginTop: 22 }}>
                  <div style={{ ...heading, fontSize: 15, marginBottom: 8, paddingBottom: 6, borderBottom: `2px solid ${C.gold}` }}>Attachments</div>
                  {(openGuide.files || []).map((f, i) =>
                    (f.type || "").startsWith("image/") ? (
                      resImgUrls[f.path]
                        ? <img key={i} src={resImgUrls[f.path]} alt={f.name} style={{ maxWidth: "100%", borderRadius: 8, margin: "8px 0", border: `1px solid ${C.line}` }} />
                        : <div key={i} style={{ color: C.sub, fontSize: 13, margin: "8px 0" }}>Loading {f.name}…</div>
                    ) : (
                      <button key={i} style={{ ...linkBtn, marginRight: 8, marginTop: 6 }} onClick={() => openResourceFile(f.path)}>📄 {f.name}</button>
                    )
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* RESOURCE EDITOR (manager) */}
      {resEditing && (
        <div onClick={() => !resSaving && setResEditing(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(10,10,10,0.65)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 55 }}>
          <div onClick={(e) => e.stopPropagation()}
            style={{ background: "#fff", borderRadius: 12, maxWidth: 640, width: "100%", maxHeight: "88vh", overflowY: "auto", borderTop: `5px solid ${C.gold}` }}>
            <div style={{ padding: 24, display: "grid", gap: 14 }}>
              <div style={{ ...heading, fontSize: 18 }}>{resEditing.id ? "Edit Resource" : "New Resource"}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 14 }}>
                <div><span style={label}>Tag</span><input {...input({ value: resEditing.tag, onChange: (e) => setResEditing({ ...resEditing, tag: e.target.value.toUpperCase() }), placeholder: "TRAINING" })} /></div>
                <div><span style={label}>Title</span><input {...input({ value: resEditing.title, onChange: (e) => setResEditing({ ...resEditing, title: e.target.value }) })} /></div>
              </div>
              <div><span style={label}>Short description (shows on the card)</span><input {...input({ value: resEditing.blurb, onChange: (e) => setResEditing({ ...resEditing, blurb: e.target.value }) })} /></div>
              <div>
                <span style={label}>Content</span>
                <textarea {...input({ value: resEditing.body, onChange: (e) => setResEditing({ ...resEditing, body: e.target.value }), rows: 10, placeholder: "Write the guide here. Start a line with # to make a gold section heading. Leave a blank line between paragraphs." })} />
              </div>
              <div>
                <span style={label}>Links</span>
                {resEditing.links.map((l, i) => (
                  <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1.6fr auto", gap: 8, marginBottom: 8 }}>
                    <input {...input({ value: l.label || "", onChange: (e) => { const links = [...resEditing.links]; links[i] = { ...links[i], label: e.target.value }; setResEditing({ ...resEditing, links }); }, placeholder: "Label" })} />
                    <input {...input({ value: l.url || "", onChange: (e) => { const links = [...resEditing.links]; links[i] = { ...links[i], url: e.target.value }; setResEditing({ ...resEditing, links }); }, placeholder: "https://…" })} />
                    <button style={smallBtn(C.red)} onClick={() => setResEditing({ ...resEditing, links: resEditing.links.filter((_, j) => j !== i) })}>✕</button>
                  </div>
                ))}
                <button style={smallBtn(C.goldDark)} onClick={() => setResEditing({ ...resEditing, links: [...resEditing.links, { label: "", url: "" }] })}>+ Add link</button>
              </div>
              <div>
                <span style={label}>Attachments (PDFs & images, max 10MB each)</span>
                {resEditing.files.map((f, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, padding: "3px 0", fontSize: 14 }}>
                    <span>📄 {f.name}</span>
                    <button style={smallBtn(C.red)} onClick={() => setResEditing({ ...resEditing, files: resEditing.files.filter((_, j) => j !== i), removedFiles: [...resEditing.removedFiles, f.path] })}>Remove</button>
                  </div>
                ))}
                {resEditing.newFiles.map((f, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, padding: "3px 0", fontSize: 14, color: C.green, fontWeight: 700 }}>
                    <span>📄 {f.name} (new)</span>
                    <button style={smallBtn(C.red)} onClick={() => setResEditing({ ...resEditing, newFiles: resEditing.newFiles.filter((_, j) => j !== i) })}>Remove</button>
                  </div>
                ))}
                <label style={{ display: "inline-block", marginTop: 6, cursor: "pointer" }}>
                  <span style={{ ...smallBtn(C.goldDark), display: "inline-block" }}>+ Add files</span>
                  <input type="file" accept="application/pdf,image/*" multiple onChange={onPickResFiles} style={{ display: "none" }} />
                </label>
              </div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button style={btnGray} disabled={resSaving} onClick={() => setResEditing(null)}>Cancel</button>
                <button style={{ ...btnGold, opacity: resSaving ? 0.6 : 1 }} disabled={resSaving} onClick={saveResource}>{resSaving ? "Saving…" : "Save Resource"}</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && (
        <div style={{
          position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
          background: C.black, color: C.goldBright, border: `1.5px solid ${C.gold}`,
          padding: "12px 22px", borderRadius: 999, fontSize: 14, fontWeight: 800, zIndex: 60,
          boxShadow: "0 8px 24px rgba(0,0,0,0.35)", maxWidth: "90vw", textAlign: "center",
        }}>
          {toast}
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
